<div class="main-header">
    <h1 id="task-list-heading">Tasks</h1>
    <span id="task-count" class="task-count"></span>
    <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
        <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
            All
        </button>
        <button class="filter-tab" data-filter="pending" role="tab" aria-selected="false">
            Pending
        </button>
        <button class="filter-tab" data-filter="done" role="tab" aria-selected="false">
            Done
        </button>
    </div>
    <button id="theme-toggle" class="filter-tab" type="button" aria-label="Toggle theme">
        🌙
    </button>
</div>
