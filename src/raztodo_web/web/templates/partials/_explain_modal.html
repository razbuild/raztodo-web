<div
    id="explain-backdrop"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
>
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-title"></span>
            <button class="modal-close" aria-label="Close">✕</button>
        </div>
        <div class="modal-modes">
            <button class="mode-btn active" data-mode="short">Summary</button>
            <button class="mode-btn" data-mode="deep">Deep Analysis</button>
            <button class="mode-btn" data-mode="plan">Action Plan</button>
        </div>
        <div class="modal-body" id="explain-body"></div>
    </div>
</div>
